# Deltas LOCAIS de deploy do fork (pereiraoc) — addons NÃO-upstream isolados aqui
# pra manter os arquivos rastreados do Odysseus pristine e o `git rebase dev` limpo.
# Arquivo novo (sem contraparte no upstream) => nunca conflita ao sincronizar.
#
# Habilitar via COMPOSE_FILE no .env (depois do gpu.nvidia.yml):
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.nvidia.yml:docker/pereiraoc.yml
#
# Ver LOCAL_CHANGES.md (raiz do repo) pro inventário completo de deltas do fork.
services:
  odysseus:
    # O docker-compose.yml do upstream passou a apontar pra imagem do GHCR
    # (ghcr.io/odysseus-dev/odysseus:latest, build só como fallback). Essa
    # imagem NÃO tem os deltas do fork (painel de Vaults, CSP etc.): fixa o
    # nome local e força o build a partir deste checkout em todo `up`.
    image: odysseus-odysseus:latest
    pull_policy: build
    # Bind-mount dos vaults do Obsidian em /app/vaults (read-write). Sem ':z'
    # (não relabelar SELinux dos vaults reais). O entrypoint só faz chown de
    # /app/data e /app/logs → /app/vaults preserva o dono (uid 1000), editável
    # no host/Obsidian ao vivo. As listas de volumes dos overlays são somadas.
    volumes:
      - /data/vaults:/app/vaults
      # Vaults extras do painel de Vaults que vivem fora de /data/vaults:
      - /data/projects/pleitost-app:/app/vaults/pleitost-app
      - /data/projects/caelestia-arch-setup:/app/vaults/caelestia-arch-setup
      # Painel "Uso de IA" (routes/ai_usage_routes.py): banco do ai-usage-export
      # do host (timer diario do caelestia-arch-setup). So leitura.
      - /data/ai-usage:/app/ai-usage:ro
      # Sessões do Obsidian pelo painel de Vaults: o backend usa o socket pra
      # criar/ligar/desligar SÓ containers `odysseus-obsidian-<vault-id>`
      # (prefixo fixo no código; rotas com auth). TRADEOFF consciente: montar
      # o socket dá poder de docker ao container do app — aceitável neste
      # deploy single-user local; remova esta linha pra desligar o recurso.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # CUDA loader path para a wheel llama-cpp-python (cu132): libcudart/libcublas
      # vêm das wheels nvidia em ~/.local (.../nvidia/cu13/lib), fora do loader path
      # padrão. Movido pra cá do docker/gpu.nvidia.yml pra manter aquele overlay do
      # upstream pristine. NOTA: a base virou python3.14-slim e os engines de serve
      # em ./data/local foram instalados sob python3.12 → reinstalar sob 3.14 ao
      # voltar a servir GPU e ajustar este path (ver LOCAL_CHANGES.md).
      - LD_LIBRARY_PATH=/app/.local/lib/python3.12/site-packages/nvidia/cu13/lib
      # Painel de Vaults (routes/vaultfs_routes.py): identidade git dos commits
      # feitos pela UI e credencial de push/pull https. O token vai SÓ por env
      # (o credential helper inline referencia $VAULTFS_GIT_TOKEN — nunca em
      # argv nem em disco). Preencher o token via .env do compose.
      - GIT_AUTHOR_NAME=pereiraoc
      - GIT_AUTHOR_EMAIL=pereiraoc@gmail.com
      - GIT_COMMITTER_NAME=pereiraoc
      - GIT_COMMITTER_EMAIL=pereiraoc@gmail.com
      - VAULTFS_GIT_USER=sfynz
      - VAULTFS_GIT_TOKEN=${VAULTFS_GIT_TOKEN:-}
      # Mecanismo UPSTREAM do entrypoint: com o socket montado, adiciona o
      # usuário do app ao grupo do socket e preserva grupos no gosu.
      - ODYSSEUS_ENABLE_HOST_DOCKER=true
      # Sessões do Obsidian por vault (containers dinâmicos, sem serviço
      # fixo): tradução container→host pros binds das sessões e faixa de
      # portas liberada no CSP pra iframar o desktop remoto (Selkies) de
      # cada sessão.
      - VAULTFS_HOST_MAP=/app/vaults/pleitost-app=/data/projects/pleitost-app,/app/vaults/caelestia-arch-setup=/data/projects/caelestia-arch-setup,/app/vaults=/data/vaults,/app/data=/data/projects/odysseus/data
      - OBSIDIAN_SESSIONS_DIR=/app/data/obsidian-sessions
      # Render node passado pras sessões do Obsidian. SEM isso o wrapper da
      # imagem não liga --ozone-platform=wayland, o Obsidian sobe no X11
      # (Xwayland) e o selkies PERDE todo caractere acentuado digitado
      # rápido (<~100ms/tecla): acentuado é injetado por `wtype`, que troca o
      # keymap do compositor e digita na hora — o cliente X11 não aplica o
      # keymap a tempo. ASCII nunca cai (vai por scancode/uinput).
      # Aqui é a iGPU Intel (pci 00:02.0). NÃO passe /dev/dri inteiro nem o
      # node da nvidia: a sessão entra em crash-loop. Use o symlink by-path —
      # a numeração renderD12x troca entre boots (2026-10-06 a iGPU virou
      # renderD128 e o renderD129 antigo passou a ser a nvidia). Confira com
      # `ls -l /dev/dri/by-path/` — o alvo é o *-render da integrada.
      - OBSIDIAN_DRI_NODE=/dev/dri/by-path/pci-0000:00:02.0-render
      # Painel "Finanças" (routes/finance_routes.py, src/finance): segredos SÓ via
      # .env do compose (gitignored). Token do Wise = "Read only"; a senha dos PDFs
      # de fatura do Santander abre os arquivos guardados em data/finance/raw.
      - WISE_API_TOKEN=${WISE_API_TOKEN:-}
      - FINANCE_PDF_PASSWORD=${FINANCE_PDF_PASSWORD:-}
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID:-}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET:-}
      - PLUGGY_ITEM_IDS=${PLUGGY_ITEM_IDS:-}
      - CSP_EXTRA_FRAME_SRC=http://localhost:3010 http://localhost:3011 http://localhost:3012 http://localhost:3013 http://localhost:3014 http://localhost:3015 http://localhost:3016 http://localhost:3017 http://localhost:3018 http://localhost:3019
      # Grupo "Trading" (LOCAL_CHANGES.md §8): o painel fala com o Trading Lab pela
      # rede interna do compose.
      - TRADING_LAB_URL=http://tradingagents-lab:7100

  # Trading Lab (LOCAL_CHANGES.md §8): motor do fork pereiraoc/TradingAgents
  # (tradingagents/lab). Toda a logica de carteira ficticia vive la; sem ports
  # (so a rede interna). Alcanca o Qwen do Cookbook em http://odysseus:8000/v1.
  # Atualizar: git pull no fork + `docker compose build tradingagents-lab && docker compose up -d tradingagents-lab`.
  tradingagents-lab:
    build: /data/projects/TradingAgents
    image: tradingagents-lab:latest
    pull_policy: build
    command: ["lab", "serve", "--host", "0.0.0.0", "--port", "7100"]
    environment:
      - TRADINGAGENTS_LAB_DIR=/home/appuser/.tradingagents
    volumes:
      - /data/trading:/home/appuser/.tradingagents
    restart: unless-stopped
